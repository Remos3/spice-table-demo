<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - The Spice Table</title>
    <script src="./js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <nav class="sticky-nav bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <a href="./index.html" class="text-2xl font-black text-brand tracking-tight brand-name">Brand</a>
                <div class="flex items-center space-x-6">
                    <a href="./index.html" class="text-gray-600 font-medium">Home</a>
                    <a href="./cart.html" class="relative text-gray-600 hover:text-brand flex items-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span class="cart-badge absolute -top-2 -right-2 bg-brand text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full" style="display:none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-3xl font-bold mb-6">Our Menu</h2>
        
        <div class="bg-white p-4 rounded-xl shadow-sm mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <input type="text" id="search-menu" placeholder="Search dish..." class="w-full md:w-64 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-brand">
            
            <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
                <button class="cat-btn bg-brand text-white px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap" data-cat="All">All</button>
                <button class="cat-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap" data-cat="Fast Food">Fast Food</button>
                <button class="cat-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap" data-cat="Pizza">Pizza</button>
                <button class="cat-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap" data-cat="Starters">Starters</button>
                <button class="cat-btn bg-gray-100 text-gray-700 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap" data-cat="Chinese">Chinese</button>
            </div>

            <label class="flex items-center cursor-pointer space-x-2">
                <span class="text-sm font-medium text-gray-700">Veg Only</span>
                <input type="checkbox" id="veg-toggle" class="w-5 h-5 accent-green-600 rounded">
            </label>
        </div>

        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Loaded via JS -->
        </div>
    </main>

    <script src="./js/cart.js"></script>
    <script src="./js/menu.js"></script>
</body>
</html>
