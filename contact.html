<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - The Spice Table</title>
    <script src="./js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 flex justify-between h-16 items-center">
            <a href="./index.html" class="text-2xl font-black text-brand brand-name">Brand</a>
            <a href="./menu.html" class="text-gray-600 hover:text-brand font-medium">&larr; Back to Menu</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-10">
        <h2 class="text-3xl font-bold mb-6">Your Order</h2>
        
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <div id="cart-list" class="divide-y divide-gray-100">
            </div>
            
            <div class="mt-6 pt-4 border-t border-gray-200 flex justify-between items-center">
                <span class="text-lg font-medium text-gray-600">Total Amount:</span>
                <span id="cart-total" class="text-2xl font-bold text-gray-900">₹0</span>
            </div>
        </div>

        <button onclick="checkout()" class="w-full bg-green-500 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-600 transition flex justify-center items-center gap-2">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.183-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.765-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824z"/></svg>
            Order on WhatsApp
        </button>
    </main>

    <script src="./js/cart.js"></script>
    <script>
        function renderCartItems() {
            const list = document.getElementById('cart-list');
            const totalEl = document.getElementById('cart-total');
            list.innerHTML = '';
            
            if (cart.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-500 py-4">Your cart is empty.</p>';
                totalEl.textContent = SITE_CONFIG.currency + '0';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                list.innerHTML += `
                    <div class="flex justify-between items-center py-4 border-b border-gray-50 last:border-0">
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-800">${item.name}</h4>
                            <p class="text-sm text-gray-500">${SITE_CONFIG.currency}${item.price}</p>
                        </div>
                        <div class="flex items-center space-x-3 bg-gray-50 rounded-lg p-1 border">
                            <button onclick="changeQty(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center font-bold text-gray-600 hover:bg-gray-200 rounded">-</button>
                            <span class="font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-8 h-8 flex items-center justify-center font-bold text-gray-600 hover:bg-gray-200 rounded">+</button>
                        </div>
                    </div>
                `;
            });
            totalEl.textContent = SITE_CONFIG.currency + total;
        }

        document.addEventListener("DOMContentLoaded", renderCartItems);
    </script>
</body>
      </html>
